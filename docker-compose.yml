services:
  model:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    environment:
      NOTE2TASK_MODEL: ${NOTE2TASK_MODEL:-qwen2.5:3b}
    command:
      - |
        set -e
        ollama serve &
        server_pid=$$!
        trap 'kill "$$server_pid" 2>/dev/null || true' EXIT
        trap 'exit 0' TERM INT

        until ollama list >/dev/null 2>&1; do
          kill -0 "$$server_pid"
          sleep 1
        done

        ollama show "$$NOTE2TASK_MODEL" >/dev/null 2>&1 || ollama pull "$$NOTE2TASK_MODEL"
        echo "Model $$NOTE2TASK_MODEL is ready."
        wait "$$server_pid"
    gpus: all
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - ./secrets:/app/secrets
    ports:
      - "127.0.0.1:${NOTE2TASK_API_PORT:-8000}:8000"
    depends_on:
      - model

volumes:
  ollama_data:
